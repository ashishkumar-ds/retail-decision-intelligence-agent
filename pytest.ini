[pytest]
testpaths = tests
markers =
    mock: Deterministic tests in which all external integrations (forecast API, campaign audit) are faked or monkeypatched. This is the default offline suite.
    real_data: Tests using realistic transaction-shaped data (fixed fixtures), with the forecast API mocked so results stay deterministic.
    live_api: Smoke tests against the deployed live Forecast and Campaign Audit APIs. Included in the default run (design change: the suite treats live connectivity as part of the contract); point FORECAST_API_URL at a local instance to run fully offline.
addopts = -ra --strict-markers
