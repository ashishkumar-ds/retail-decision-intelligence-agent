[pytest]
testpaths = tests
markers =
    mock: Deterministic tests in which all external integrations (forecast API, campaign audit) are faked or monkeypatched. This is the default offline suite.
    real_data: Tests using realistic transaction-shaped data (fixed fixtures), with the forecast API mocked so results stay deterministic.
    live_api: Smoke tests against the deployed live Forecast and Campaign Audit APIs. Excluded from the default run (live Render free-tier services fail CI with no code change, and every fork's PR would call the author's deployed endpoints by default); run them explicitly with `pytest -m live_api` (point FORECAST_API_URL at a local instance to avoid live calls).
addopts = -ra --strict-markers -m "not live_api"
