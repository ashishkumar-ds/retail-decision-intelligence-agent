# Live LLM canary. The offline suite proves the *gates* (evaluation/llm_evals.py,
# hermetic, no network); nothing in CI proved the *provider path* — the real
# key, base URL and model name — still works. That is the one failure mode the
# service cannot see: every layer fails closed to the deterministic template, so
# a retired model or a rotated key looks exactly like health (ADR-0006).
#
# One call a day against the configured provider closes that gap. It is
# deliberately NOT part of ci.yml: it needs a network and a secret, and a
# portfolio repo must stay green for anyone who forks it without one.
name: LLM live smoke (nightly)

on:
  schedule:
    # 06:17 UTC daily — off the hour so it does not queue behind other crons.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project + LLM deps
        run: pip install -e ".[dev]"
      - name: Is a provider credential configured?
        id: creds
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          if [ -n "$LLM_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LLM_API_KEY is not set; skipping the live smoke (fork or unconfigured repo)."
          fi
      - name: Live provider smoke (one real call; requires a grounded answer)
        if: steps.creds.outputs.configured == 'true'
        env:
          # Mirror render.yaml: the published demo runs Groq via the
          # OpenAI-compatible path. Keep the model in step with the blueprint.
          LLM_PROVIDER: openai_compat
          LLM_BASE_URL: https://api.groq.com/openai/v1
          LLM_MODEL: qwen/qwen3.8-27b
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python scripts/smoke_llm_live.py
