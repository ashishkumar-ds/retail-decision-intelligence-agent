# Alerting rules for the Retail Decision Intelligence Agent.
# Scrape `GET /metrics` with the approval bearer token (the endpoint is
# fail-closed: without a configured credential it returns 503, so use
# `authorization: {credentials: <token>}` in the scrape config — see README.md).
groups:
  - name: retail-decision-agent
    rules:
      # --- governance: the provenance data now makes this detectable ---------
      - alert: RetailDecisionsConcentratedInOnePrincipal
        expr: |
          (
            max by (principal) (retail_decisions_by_principal)
            /
            ignoring(principal) group_left sum by () (retail_decisions_by_principal)
          ) > 0.8
          and
          sum by () (retail_decisions_by_principal) >= 5
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "One principal made >80% of all decisions ({{ $labels.principal }})"
          description: >-
            Decisions are supposed to be human-gated with distinct approvers.
            A single principal dominating the ledger suggests a shared token in
            use, or a broken approval queue routing everyone to one person.
            Check APPROVAL_TOKENS assignments and the pending-approval backlog.

      # --- heartbeat: a dead scheduler is silent without this -----------------
      - alert: RetailSweepFailures
        expr: increase(retail_sweeps_total{result="failed"}[1h]) > 0
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "Autonomous sweep is failing"
          description: >-
            The daily sweep raised. The scheduler retries on the next tick, so
            this alert means at least one full cycle failed - check the
            `[SWEEP SCHEDULER] sweep failed` application logs (likely the
            forecast API or the campaign audit feed).

      - alert: RetailSweepStale
        expr: |
          time() - retail_last_sweep_timestamp_seconds > 172800   # 48h
        for: 1h
        labels:
          severity: critical
        annotations:
          summary: "No successful sweep in 48h"
          description: >-
            The agent has stopped evaluating stores (scheduler disabled,
            crashed, or the process restarted without SWEEP_ENABLED). Absence
            of failure metrics is not health - this is the signal that the
            heartbeat is gone.

      # --- backlog: approvals nobody is clearing -----------------------------
      - alert: RetailPendingApprovalBacklog
        expr: retail_pending_approvals > 50
        for: 2h
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} recommendations awaiting human approval"
          description: >-
            Undecided recommendations beyond the expected operating backlog.
            Either reviewers are not seeing the queue (see the board UI) or the
            sweep is outrunning human capacity.

      # --- off-path LLM: a guard nobody measures is not a guard --------------
      - alert: RetailOffpathLlmGuardRejectionSurge
        expr: |
          (
            sum(rate(retail_offpath_llm_guard_rejections_total[1h]))
            /
            clamp_min(sum(rate(retail_offpath_llm_events_total[1h])), 0.001)
          ) > 0.3
          and
          sum(increase(retail_offpath_llm_events_total[1h])) >= 10
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Over 30% of off-path LLM drafts vetoed by the grounding gates"
          description: >-
            The explainer/advisory layers are producing untraceable numbers,
            invented citations or unknown engine vocabulary far more often than
            the calibrated baseline. Nothing on the decision path is affected
            (the deterministic template is served) - which is precisely why this
            needs an alert: the service looks perfectly healthy while the LLM
            layer is useless. Usual causes: a substituted/upgraded model, a
            drifted prompt, or a changed evidence block. See rag/llm_telemetry.py
            and the pinned cases in evaluation/llm_evals.py.

      - alert: RetailOffpathLlmDegradedToTemplate
        expr: increase(retail_offpath_llm_events_total{outcome="unavailable"}[1h]) > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Off-path LLM layer failing; deterministic output served instead"
          description: >-
            Provider or parse failures are absorbed silently by design
            (fail-closed: the template or engine output is served). Absence of
            user-visible errors is not health - check the API key, base URL and
            provider status, and confirm the layer is meant to be on (/health
            reports the LLM flags).
