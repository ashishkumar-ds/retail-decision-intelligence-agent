[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retail-decision-intelligence-agent"
version = "1.0.0"
description = "Deterministic decision-intelligence engine for retail store recovery recommendations, with an event-sourced Phase 2 intervention lifecycle."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "requests==2.32.3",
    # Imported at module load by the serving path itself (app/main.py:20,
    # tools/forecast_tool.py, tools/campaign_tool.py, phase2/portfolio.py) -
    # NOT a test/client convenience. The first production deploy died on boot
    # because this lived only in [dev]; runtime and tests must share it.
    "httpx==0.27.2",
    # Direct runtime dependency: phase2/schemas.py, tools/campaign_tool.py and
    # presentation/cards.py import pydantic at module load. It used to be only a
    # transitive dependency (via FastAPI), so installing this package's declared
    # deps alone could break `import phase2`. Declared explicitly now.
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.42.0",
]
dev = [
    "pytest==8.3.3",
    "httpx==0.27.2",
    "ruff==0.16.4",
]
storage = [
    "psycopg[binary]>=3.1",
]

[tool.setuptools]
# Every importable top-level package must be listed here: an editable install
# maps exactly these names, so a package left out is unimportable from outside
# the repo root (and bare `pytest` does not put the CWD on sys.path). Listed
# alphabetically; `agent/` and `evaluation/` have no __init__.py and are not
# importable packages.
packages = [
    "analytics",
    "app",
    "approvals",
    "decision_engine",
    "execution",
    "guardrails",
    "memory",
    "phase2",
    "presentation",
    "rag",
    "storage",
    "tools",
]
